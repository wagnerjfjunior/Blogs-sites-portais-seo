name: validate-agent-framework

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout exact non-PR revision
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate canonical framework
        run: python scripts/validate_repository.py
      - name: Run SFJM adversarial tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Revalidate canonical framework after tests
        run: python scripts/validate_repository.py
      - name: Validate legacy Builder Action compatibility
        run: python scripts/validate_builder_action.py
