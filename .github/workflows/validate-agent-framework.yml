name: bootstrap-consolidated-framework

on:
  pull_request:
  push:
    branches:
      - feat/bootstrap-gpt-framework

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[framework-consolidated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-gpt-framework
      - name: Apply consolidated canonical framework
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          parts = sorted(Path('.bootstrap').glob('framework.part*'))
          if not parts:
              raise SystemExit('bootstrap archive parts not found')
          payload = ''.join(part.read_text(encoding='utf-8') for part in parts)
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.')
          for part in parts:
              part.unlink()
          Path('.bootstrap').rmdir()
          PY
      - name: Validate consolidated framework
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/validate_repository.py
      - name: Commit consolidated update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: consolidate canonical GPT framework [framework-consolidated]"
          git push origin HEAD:feat/bootstrap-gpt-framework
