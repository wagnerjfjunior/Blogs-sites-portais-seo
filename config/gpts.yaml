    outputs:
    - relatório de pesquisa
    - mapa de clusters
    - priorização
    - registro de fontes e limitações
    prohibited_actions:
    - inventar volume, CPC, dificuldade ou concorrência
    - apresentar estimativas como medições
    - ocultar limitações das ferramentas
