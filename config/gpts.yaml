    skill: .agents/skills/seo-arquiteto-ecossistema/SKILL.md
    canonical_document: docs/gpts/gpt1.md
    builder_manifest: config/builder/gpt1.yaml
    builder_instructions: docs/gpts/gpt1-builder-instructions.md
    acceptance_tests: tests/gpts/gpt1/acceptance-cases.yaml
