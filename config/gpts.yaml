api_version: blogs-sites-portais-seo/v1
kind: GPTRegistry
metadata:
  project_id: blogs-sites-portais-seo
  visibility: private
  audience: owner_only
spec:
  verdicts:
  - PASS
  - PASS_WITH_RESIDUAL_RISK
  - BLOCK
  - INCONCLUSIVE
  agents:
  - id: gpt0
    name: GPT0 — SEO - Auditor documental
    slug: seo-auditor-documental
    status: active
    visibility: private
    audience: owner_only
    external_gpt_id: g-6a71de286da481919ddd357950222c9b
    external_gpt_url: https://chatgpt.com/g/g-6a71de286da481919ddd357950222c9b-gpt0-seo-auditor-documental
    mission: Auditar documentação canônica, coerência, completude, rastreabilidade e evidências sem implementar a mudança
      auditada.
    skill: .agents/skills/seo-auditor-documental/SKILL.md
    canonical_document: docs/gpts/gpt0.md
    builder_manifest: config/builder/gpt0.yaml
    builder_instructions: docs/gpts/gpt0-builder-instructions.md
    acceptance_tests: tests/gpts/gpt0/acceptance-cases.yaml
    action_profile: github_read_only
    inputs:
    - escopo e critérios de aceite
    - head ou versão exata
    - documentos e evidências completas
    outputs:
    - relatório de auditoria
    - matriz de cobertura
    - achados por severidade
    - veredito oficial
    prohibited_actions:
    - implementar ou corrigir a mudança auditada
    - comentar, aprovar, marcar Ready ou fazer merge sem autorização
    - preencher lacunas com suposições
  - id: gpt1
    name: GPT1 — SEO - Arquiteto do ecossistema
    slug: seo-arquiteto-ecossistema
    status: active
    visibility: private
    audience: owner_only
