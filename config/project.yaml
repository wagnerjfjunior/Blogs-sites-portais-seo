api_version: blogs-sites-portais-seo/v1
kind: Project
metadata:
  id: blogs-sites-portais-seo
  name: Ecossistema de Blogs, Sites, Portais e SEO
  visibility: private
  audience: owner_only
  status: bootstrap
spec:
  canonical_repository: wagnerjfjunior/Blogs-sites-portais-seo
  default_branch: main
  write_mode: pull_request
  gpt_registry: config/gpts.yaml
  ses:
    adoption_manifest: config/ses.yaml
    gateway_project_id: blogs-sites-portais-seo
  documentation_root: docs
  skills_root: .agents/skills
  builder_root: config/builder
  tests_root: tests/gpts
  sfjm:
    manifest: config/sfjm.yaml
    bootstrap: bootstrap/BOOTSTRAP_CANONICO.md
    current_handoff: handoffs/CURRENT.md
    project_status: docs/PROJECT_STATUS.md
    next_safe_action: docs/NEXT_SAFE_ACTION.md
    blocked_actions: docs/BLOCKED_ACTIONS.md
    continuity_policy: docs/governance/sfjm-continuity-policy.md
  actions:
    github_read_only: config/actions/github-read-only.openapi.yaml
    mutation_actions_enabled: false
  policies:
    canonical_source: github
    direct_main_writes: false
    ready_requires_explicit_authorization: true
    merge_requires_separate_explicit_authorization: true
    external_mutation_requires_explicit_authorization: true
    head_drift_invalidates_gates: true
    missing_information_must_not_be_inferred: true
    exactly_one_authoritative_next_safe_action: true
    next_safe_action_path: docs/NEXT_SAFE_ACTION.md
