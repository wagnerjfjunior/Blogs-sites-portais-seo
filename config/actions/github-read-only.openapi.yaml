      parameters:
      - name: sha
        in: query
        required: false
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/commits/{ref}:
    get:
      operationId: getSeoEcosystemCommit
      summary: Obter commit e arquivos alterados
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
