openapi: 3.1.0
info:
  title: Ecossistema SEO GitHub Read-Only
  description: Acesso somente leitura e fixo ao repositório canônico para auditoria e lifecycle.
  version: 1.0.0
servers:
- url: https://api.github.com
  description: GitHub REST API
paths:
  /user:
    get:
      operationId: getAuthenticatedGitHubUser
      summary: Verificar identidade autenticada
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
  /repos/wagnerjfjunior/Blogs-sites-portais-seo:
    get:
      operationId: getSeoEcosystemRepository
      summary: Obter metadados do repositório
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/branches:
    get:
      operationId: listSeoEcosystemBranches
      summary: Listar branches
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/branches/{branch}:
    get:
      operationId: getSeoEcosystemBranch
      summary: Resolver branch e head
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: branch
        in: path
        required: true
        schema:
          type: string
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/git/commits/{commit_sha}:
    get:
      operationId: getSeoEcosystemGitCommit
      summary: Obter commit Git e tree SHA
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: commit_sha
        in: path
        required: true
        schema:
          type: string
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/git/trees/{tree_sha}:
    get:
      operationId: getSeoEcosystemGitTree
      summary: Ler árvore Git; não considerar completa se truncated=true
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: tree_sha
        in: path
        required: true
        schema:
          type: string
      - name: recursive
        in: query
        required: false
        schema:
          type: string
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/contents/{path}:
    get:
      operationId: getSeoEcosystemFileRaw
      summary: Ler arquivo bruto por caminho e referência
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: ref
        in: query
        required: true
        schema:
          type: string
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/git/blobs/{blob_sha}:
    get:
      operationId: getSeoEcosystemBlob
      summary: Ler blob exato
      x-openai-isConsequential: false
      responses:
        '200':
          description: Resposta bem-sucedida
        '401':
          description: Token inválido ou ausente
        '403':
          description: Permissão insuficiente
        '404':
          description: Objeto não encontrado
      parameters:
      - name: blob_sha
        in: path
        required: true
        schema:
          type: string
  /repos/wagnerjfjunior/Blogs-sites-portais-seo/commits:
    get:
      operationId: listSeoEcosystemCommits
      summary: Listar commits
      x-openai-isConsequential: false
